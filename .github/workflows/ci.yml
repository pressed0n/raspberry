# Verify-only CI. No secrets, no deployment, no write permissions.
#
# Raspberry's local preview is developed on a machine where the agent harness
# cannot execute `pnpm`, so this workflow exists to turn "reads as if it
# compiles" into a check anyone can inspect on a public repo. Actions minutes
# are unlimited on public repositories, and nothing here is privileged: a fork
# pull request gets the same read-only token as a maintainer push.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege for the whole workflow. Individual jobs cannot exceed this.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.25.0"
  NEXT_TELEMETRY_DISABLED: "1"
  CI: "true"

jobs:
  # Fails in seconds, before any dependencies are installed. This repository
  # keeps a write-capable deploy key in .secrets/ and a live SQLite database in
  # data/, so the cheapest possible guard against committing either is worth
  # more than faster feedback on a type error.
  hygiene:
    name: No secrets or data tracked
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Refuse tracked credentials, databases, and env files
        shell: bash
        run: |
          set -euo pipefail
          # .env.example is the documented template and is allowed; every other
          # .env variant, the deploy key directory, the data directory, and any
          # key/database file extension are not.
          offenders="$(git ls-files | grep -E \
            '(^|/)\.env(\.[^/]*)?$|^(data|\.secrets)/|\.(sqlite|sqlite3|db|db-wal|db-shm|pem|key|p12|pfx|jks)$|(^|/)id_(rsa|dsa|ecdsa|ed25519)$' \
            | grep -v -x '\.env.example' || true)"
          if [ -n "$offenders" ]; then
            echo "::error::Files that must never be published are tracked:"
            echo "$offenders"
            exit 1
          fi
          echo "Tracked file list is clean ($(git ls-files | wc -l) files)."

  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history, not checkout's default depth-1 clone. `pnpm test` runs
      # tests/docs-freshness.test.ts, which shells out to scripts/check-docs.mjs; that
      # verifies the commit docs/STATE.md names is an *ancestor* of HEAD via
      # `git merge-base --is-ancestor`. A shallow clone has no parent commit to walk to,
      # so a correct snapshot reads as "history was rewritten" and the run goes red for a
      # reason unrelated to the code — which is what happened on 2833a7c. The repo is
      # small; history is the input this job actually needs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # pnpm must exist before setup-node so its store cache can be resolved.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Tests run in-process against file::memory: and an OS temp directory, so
      # this job never needs a DATABASE_URL or a host secret. Output is kept in a
      # file because job logs require authentication to read, while annotations on
      # a public repository do not: this is what makes a red run diagnosable.
      #
      # The file goes in $RUNNER_TEMP, not the working tree. `tee "$RUNNER_TEMP/test-output.log"`
      # here put a *.log at the repo root, and scripts/check-docs.mjs fails on a root
      # log — stale run output quoting numbers nobody recomputed. So the job that ran
      # the suite created the one file the suite forbids, and the docs test went red
      # for the log's sake rather than the docs'. Both runs 11-14 failed this way and
      # the annotation only said "Documentation has drifted from the code."
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee "$RUNNER_TEMP/test-output.log"

      - name: Report failing assertions
        if: failure()
        shell: bash
        run: |
          if [ ! -f "$RUNNER_TEMP/test-output.log" ]; then exit 0; fi
          grep -E '^(✖|not ok)|AssertionError|Error:|actual:|expected:|at tests|^ *• ' "$RUNNER_TEMP/test-output.log" | head -20 | while IFS= read -r line; do
            echo "::error::${line}"
          done

  # The suite runs on SQLite unless `RASPBERRY_TEST_DATABASE_URL` says otherwise, so on
  # every other job the PostgreSQL branch of `openDatabase` — the branch a hosted
  # deployment actually uses — is never executed. That was the state of B4: the adapter
  # was written, reviewed, and completely unrun. This job is the difference between
  # "reads as if it works" and "623 of 623 passed on a real server".
  #
  # `tests/schema.ts` gives each fixture its own schema on that server, which is what makes
  # one shared database behave like the `file::memory:` the suite was written against.
  postgres:
    name: Suite on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: raspberry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RASPBERRY_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/raspberry_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee "$RUNNER_TEMP/test-output.log"

      - name: Report failing assertions
        if: failure()
        shell: bash
        run: |
          if [ ! -f "$RUNNER_TEMP/test-output.log" ]; then exit 0; fi
          grep -E '^(✖|not ok)|AssertionError|Error:|actual:|expected:|at tests|^ *• ' "$RUNNER_TEMP/test-output.log" | head -20 | while IFS= read -r line; do
            echo "::error::${line}"
          done

  build:
    name: Build (${{ matrix.shape }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # next.config.ts derives CSP, HSTS, and COOP from the same variables the
        # access guard reads, which means the deployment shape is a build input.
        # Both are compiled here so a hosted-only branch cannot rot silently
        # while the project is still being developed in local mode.
        # An empty origin is the documented "local" shape: next.config and
        # accessMode() both treat unset and empty alike.
        include:
          - shape: local
            public_origin: ""
            auth_mode: "local"
          - shape: hosted
            public_origin: "https://raspberry.example.com"
            auth_mode: "session"
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          RASPBERRY_PUBLIC_ORIGIN: ${{ matrix.public_origin }}
          RASPBERRY_AUTH_MODE: ${{ matrix.auth_mode }}
        run: pnpm build
