<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Raspberry — mobile frame</title>
<style>
  html, body { margin: 0; background: #080807; font-family: system-ui, sans-serif; }
  .stage { display: flex; gap: 40px; padding: 34px; justify-content: center; }
  .phone {
    width: 390px; height: 844px;
    border-radius: 34px;
    border: 9px solid #262424;
    background: #0d0c0c;
    box-shadow: 0 30px 80px rgba(0,0,0,.7);
    overflow: hidden;
  }
  .phone iframe { width: 100%; height: 100%; border: 0; display: block; }
  .cap { color: #6d6963; font-size: 12px; text-align: center; margin-top: 12px; letter-spacing: .04em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="stage">
    <div>
      <div class="phone"><iframe src="index.html" title="Editor at 390px"></iframe></div>
      <div class="cap">Editor · 390px</div>
    </div>
    <div>
      <div class="phone"><iframe src="index.html#sidebar" title="Sidebar at 390px"></iframe></div>
      <div class="cap">Sidebar open · 390px</div>
    </div>
  </div>
</body>
</html>
